# Game state lives in server memory, so this must stay on ONE machine.
# Deploy with: fly deploy --ha=false
app = 'avanticon-driver'
primary_region = 'yyz'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Don't sleep: a cold start mid-demo would drop every phone.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
