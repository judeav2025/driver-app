<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ava X-treme Racing · Big Screen</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="screen">
  <aside id="sidebar">
    <h1>🚗 Ava X-treme Racing</h1>
    <img id="qr" alt="QR code to join the game">
    <p class="join-text">Scan to join, or go to</p>
    <p id="url" class="url"></p>
    <p id="count" class="count">0 players</p>
    <button id="startRace" class="big" disabled>Start race</button>
    <p id="timer" class="timer" hidden></p>
    <p id="status" class="status">connecting…</p>
  </aside>
  <main>
    <canvas id="road"></canvas>
    <div id="overlay" hidden></div>
    <section id="live" hidden>
      <h2><button id="liveToggle" class="live-toggle" aria-expanded="true" aria-controls="liveBoard">
        Live scores <span class="caret" aria-hidden="true">▾</span>
      </button></h2>
      <ol id="liveBoard" class="board live"></ol>
    </section>
  </main>

  <script type="module" src="/js/screen.js"></script>
</body>
</html>
